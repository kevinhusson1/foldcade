name: Bug or plan error / Bug ou erreur de plan
description: A mistake in plans, BOM, docs or software / Une erreur dans les plans, la nomenclature, la doc ou le logiciel
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area / Domaine
      options: [hardware, electronics, software, docs, bom, other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong? / Quel est le problème ?
      description: File, page or part number, expected vs actual. / Fichier, page ou référence, attendu vs constaté.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: checkboxes
    id: safety
    attributes:
      label: Safety / Sécurité
      options:
        - label: This is a safety issue (I will use a private report instead) / Problème de sécurité (je fais un signalement privé)
