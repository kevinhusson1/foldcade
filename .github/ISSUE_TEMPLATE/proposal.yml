name: Proposal / Proposition
description: Suggest a feature, variant or design change / Proposer une fonctionnalité, variante ou modification
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea / Idée
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why? / Pourquoi ?
  - type: textarea
    id: impact
    attributes:
      label: Impact (cost, safety, difficulty) / Impact (coût, sécurité, difficulté)
